# Unbinding C-b
unbind C-b
set-option -g prefix C-o
bind-key C-o send-prefix

# split panes using l and j
bind o split-window -h
bind i split-window -v
unbind '"'
unbind %

set -sg escape-time 0

# switch panes using Alt-arrow without prefix
bind -n M-u select-pane -U
bind -n M-d select-pane -R 

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Vim keybindings
setw -g mode-keys vi

# pane resizing with vim key bindings 
bind-key -r h resize-pane -L 5
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r l resize-pane -R 5

# previous window rebind to prefix + b (we'll use prefix + p for pasting later)
unbind-key b
bind-key b previous-window

# vim copy yank
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# vim paste
unbind-key p
bind-key p run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ==========================================
# Tmux Theme (Matugen Template)
# ==========================================

# Base bar settings
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 1

# Base transparent background for the empty space
set -g status-style 'bg=default,fg={{colors.primary.default.hex}}'

# --- Panes ---
set -g pane-border-style 'fg={{colors.surface_variant.default.hex}}'
set -g pane-active-border-style 'fg={{colors.primary.default.hex}}'

# --- Messages & Modes ---
setw -g clock-mode-colour '{{colors.primary.default.hex}}'
setw -g mode-style 'fg={{colors.on_secondary_container.default.hex}} bg={{colors.secondary_container.default.hex}} bold'
set -g message-style 'fg={{colors.on_tertiary_container.default.hex}} bg={{colors.secondary.default.hex}} bold'

# --- Session Name ---
set -g status-left "#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold] 󰣇 #S #[bg={{colors.secondary_container.default.hex}},fg={{colors.primary.default.hex}},nobold,nounderscore,noitalics]"

# --- Left Status ---
set -g window-status-current-format "#[bg={{colors.secondary_container.default.hex}},fg={{colors.on_secondary_container.default.hex}},bold] #I #[bg={{colors.tertiary.default.hex}},fg={{colors.secondary_container.default.hex}},nobold,nounderscore,noitalics]#[bg={{colors.tertiary.default.hex}},fg={{colors.on_secondary.default.hex}},bold] >_ #W #[bg=default,fg={{colors.tertiary.default.hex}},nobold,nounderscore,noitalics]"

# --- Blank Middle Section ---
set -g window-status-format "#[bg=default,fg={{colors.on_surface.default.hex}},nobold]  #I #W  "

# Window activity/bell: Error colors so it actually grabs your attention
setw -g window-status-bell-style 'fg={{colors.on_error.default.hex}} bg={{colors.error.default.hex}} bold'

# --- Right Status ---
set -g status-right "#[fg={{colors.tertiary.default.hex}},bg=default,nobold,nounderscore,noitalics]#[bg={{colors.tertiary.default.hex}},fg={{colors.on_secondary.default.hex}},bold] 󰋜 #H #[fg={{colors.primary.default.hex}},bg={{colors.tertiary.default.hex}},nobold,nounderscore,noitalics]#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold] 󰥔 %m/%d %H:%M "

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
# set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
