[config]
prefer = "saturation"
fallback_color = "#000000"

[config.wallpaper]
command = "waypaper"
arguments = ["--restore"]
set = true

[templates.zsh]
input_path = './templates/zsh-colors.zsh'
output_path = '~/.cache/matugen-zsh-colors.zsh'
post_hook = 'source ~/.zshrc'

[templates.nvim]
input_path = './templates/nvim_colors.lua'
output_path = '~/dotfiles/.config/nvim/lua/plugins/matugen_colors.lua'

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'killall waybar && waybar & disown'

[templates.hyprland]
input_path = './templates/colors.lua'
output_path = '~/.config/hypr/modules/generated_colors.lua'
post_hook = 'hyprctl reload'

[templates.tmux]
input_path = './templates/tmux.conf'
output_path = '~/.tmux.conf'
post_hook = 'tmux source-file ~/.tmux.conf'

[templates.wofi]
input_path = "./templates/colors.css"
output_path = "~/.config/wofi/colors.css"

[templates.waypaper]
input_path = "./templates/colors.css"
output_path = "~/.config/waypaper/colors.css"

[templates.yazi]
input_path = './templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.starship]
input_path = './templates/starship-colors.toml'
output_path = '~/.config/starship.toml'

[templates.ghostty]
input_path = './templates/ghostty'
output_path = '~/.config/ghostty/config.ghostty'

[templates.fastfetch]
input_path = './templates/fastfetch.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

[templates.cava]
input_path = './templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen-themes'
post_hook = 'killall cava'

[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.zathura]
input_path = './templates/zathurarc'
output_path = '~/.config/zathura/zathurarc'

[templates.firefox-website-colors]
input_path = "./templates/firefox-colors.css"
output_path = "~/.zen/db96avul.Default (release)/chrome/colors.css"

[templates.qt5ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'killall -s SIGUSR1 gtk3-adwaita-theme 2>/dev/null || true'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = 'killall -s SIGUSR1 gtk4 2>/dev/null || true'
